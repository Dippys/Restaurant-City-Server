<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant City - Play</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    background-attachment: scroll;
  }
  .game-status { color: #eafaff; font-size: 13px; font-weight: 700; }
  main {
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 24px 20px;
    /* sky world with soft clouds */
    background:
      radial-gradient(160px 60px at 18% 24%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(200px 76px at 80% 18%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(150px 60px at 55% 70%, rgba(255,255,255,.6), transparent 70%),
      linear-gradient(180deg, var(--sky) 0%, #8bd8f2 55%, var(--sky-pale) 100%);
  }
  .stage {
    width: min(100%, 780px);
    aspect-ratio: 760 / 600;
    background: #050607;
    border: 6px solid var(--steel);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--steel-dk), 0 22px 50px rgba(29,84,120,.4);
    overflow: hidden;
  }
  object, embed { display: block; width: 100%; height: 100%; }
  @media (max-height: 720px) {
    main { padding: 10px; }
    .stage { width: min(100%, calc((100vh - 92px) * 1.2667)); }
  }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    splashScreen: false,
    warnOnUnsupportedContent: false,
  };
</script>
<script src="/ruffle/ruffle.js"></script>
</head>
<body>
<header class="rc-topbar">
  <a class="rc-brand" href="/"><span class="rc-plate"></span><span class="rc-wordmark">Restaurant City</span></a>
  <span class="game-status" id="accountStatus">Checking login…</span>
  <div style="flex:1"></div>
  <nav style="display:flex;gap:10px">
    <a class="rc-btn ghost small" href="/">Home</a>
    <button id="logoutButton" class="rc-btn small hidden" type="button">Log out</button>
  </nav>
</header>
<main id="main"></main>
<script>
const main = document.getElementById("main");
const statusEl = document.getElementById("accountStatus");
const logoutButton = document.getElementById("logoutButton");
let csrfToken = "";

init();

async function init() {
  try {
    const session = await requestJson("/__api/session");
    if (session.loggedIn && session.account) {
      csrfToken = session.csrfToken || "";
      showGame(session.account);
      return;
    }
  } catch {
    // Fall through to login redirect.
  }

  location.replace("/login?next=/game");
}

function showGame(account) {
  statusEl.textContent = `Playing as ${account.username}`;
  logoutButton.classList.remove("hidden");
  main.innerHTML = `
    <div class="stage">
      <object data="/game.swf?account=${encodeURIComponent(account.networkUid)}" type="application/x-shockwave-flash" width="760" height="600">
        <param name="movie" value="/game.swf?account=${escapeHtml(encodeURIComponent(account.networkUid))}" />
        <param name="quality" value="high" />
        <param name="allowScriptAccess" value="always" />
        <embed src="/game.swf?account=${escapeHtml(encodeURIComponent(account.networkUid))}" width="760" height="600" quality="high" allowScriptAccess="always" />
      </object>
    </div>
  `;
}

logoutButton.addEventListener("click", async () => {
  await requestJson("/__api/logout", { method: "POST", headers: { "X-CSRF-Token": csrfToken } });
  location.replace("/");
});

async function requestJson(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const data = await response.json();
  if (!response.ok || !data.ok) {
    throw new Error(data.error || `Request failed with ${response.status}`);
  }
  return data;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}
</script>
</body>
</html>
