<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RC Reborn · Admin</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg:#101112; --side:#151719; --surface:#1b1e20; --surface2:#24282b;
    --line:#343a3f; --text:#edf1f3; --muted:#9aa3aa; --accent:#62b47d;
    --accent2:#d4ad5f; --red:#df7474; --blue:#6aa9d8;
    --mono:'Cascadia Code','Consolas','SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:grid; grid-template-columns:220px 1fr;
  }
  /* ---- sidebar ---- */
  #rc-side {
    background:var(--side); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:18px; padding:18px 14px;
    position:sticky; top:0; height:100vh; overflow:auto;
  }
  #rc-side .rc-brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:.2px; }
  #rc-side .rc-plate {
    width:18px; height:18px; border-radius:5px; flex:none;
    background:linear-gradient(135deg,var(--accent),#3e7c57);
    box-shadow:0 2px 6px rgba(98,180,125,.4);
  }
  #rc-nav { display:flex; flex-direction:column; gap:2px; }
  #rc-nav a {
    color:var(--muted); text-decoration:none; padding:8px 10px; border-radius:8px;
    font-weight:600; font-size:13.5px; border:1px solid transparent;
  }
  #rc-nav a:hover { color:var(--text); background:var(--surface); }
  #rc-nav a.active { color:#fff; background:var(--surface2); border-color:var(--line); }
  .rc-side-foot { margin-top:auto; display:flex; flex-direction:column; gap:8px; font-size:12px; }
  .rc-side-foot a.rc-btn { text-decoration:none; text-align:center; }
  .rc-dim { color:var(--muted); font-weight:500; }
  /* ---- main ---- */
  #rc-view { padding:22px 26px 60px; overflow:auto; height:100vh; }
  .rc-title { margin:0 0 4px; font-size:22px; font-weight:800; }
  .rc-sub { margin:0 0 18px; color:var(--muted); }
  .rc-err { color:var(--red); font-weight:700; }
  .rc-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 16px; }
  .rc-stat { color:var(--muted); font-size:12px; }
  /* ---- cards ---- */
  .rc-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px; }
  .rc-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .rc-card-label { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; }
  .rc-card-value { font-size:24px; font-weight:800; margin-top:4px; }
  .rc-card-sub { color:var(--muted); font-size:12px; margin-top:2px; }
  /* ---- panels ---- */
  .rc-panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:18px; overflow-wrap:anywhere; min-width:0; }
  .rc-panel h2 { margin:0 0 12px; font-size:15px; }
  .rc-panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .rc-panel-head h2 { margin:0; }
  .rc-grid { columns:420px 2; column-gap:18px; }
  .rc-grid > .rc-panel { break-inside:avoid; margin-bottom:18px; min-width:0; }
  /* ---- buttons ---- */
  .rc-btn {
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 12px; cursor:pointer; font-size:12.5px; font-weight:600;
  }
  .rc-btn:hover { border-color:var(--accent); }
  .rc-btn.primary { background:var(--accent); border-color:var(--accent); color:#08120b; }
  .rc-btn.primary:hover { filter:brightness(1.08); }
  .rc-btn.danger { background:transparent; border-color:var(--red); color:var(--red); }
  .rc-btn.danger:hover { background:var(--red); color:#1a0b0b; }
  .rc-btn.small { padding:4px 9px; font-size:11.5px; border-radius:6px; }
  .rc-btn.icon { padding:4px 9px; }
  .rc-btn:disabled { opacity:.5; cursor:not-allowed; }
  .rc-row-actions { display:inline-flex; gap:6px; white-space:nowrap; flex-wrap:wrap; }
  /* ---- forms ---- */
  .rc-form { display:flex; flex-direction:column; gap:10px; min-width:320px; }
  .rc-form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .rc-form label.rc-check { flex-direction:row; align-items:center; gap:8px; }
  .rc-input, .rc-form select, .rc-form textarea {
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;
  }
  .rc-form textarea { resize:vertical; }
  .rc-recipient-field { display:flex; flex-direction:column; gap:4px; }
  .rc-recipient-field > label { font-size:12px; color:var(--muted); font-weight:600; }
  .rc-multi-combobox { display:flex; flex-direction:column; gap:7px; }
  .rc-recipient-chips { display:flex; flex-wrap:wrap; gap:6px; min-height:25px; }
  .rc-recipient-empty { color:var(--muted); font-size:11px; font-weight:500; padding:3px 0; }
  .rc-recipient-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(98,180,125,.38); border-radius:999px; background:rgba(98,180,125,.13); color:var(--text); padding:4px 8px 4px 10px; font:600 11.5px var(--sans); cursor:pointer; }
  .rc-recipient-chip:hover { background:rgba(98,180,125,.24); }
  .rc-recipient-chip-id { color:var(--accent2); font:600 10.5px var(--mono); }
  .rc-note { font-size:11px; color:var(--muted); font-weight:500; }
  .rc-msg { min-height:18px; font-size:12.5px; font-weight:600; }
  .rc-msg.ok { color:var(--accent); }
  .rc-msg.error { color:var(--red); }
  .rc-form .rc-btn { align-self:flex-start; }
  .rc-form .rc-btn.block { width:100%; align-self:stretch; }
  /* ---- item combobox ---- */
  .rc-combobox { position:relative; }
  .rc-combobox-list { display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60; background:var(--surface2); border:1px solid var(--line); border-radius:10px; max-height:280px; overflow:auto; box-shadow:0 14px 32px rgba(0,0,0,.5); }
  .rc-combobox-list.open { display:block; }
  .rc-combobox-item { display:flex; gap:10px; align-items:baseline; padding:7px 12px; cursor:pointer; font-size:12.5px; }
  .rc-combobox-item.active, .rc-combobox-item:hover { background:rgba(98,180,125,.16); }
  .rc-combobox-name { flex:1; word-break:break-word; }
  .rc-combobox-id { font:600 11px var(--mono); color:var(--accent2); white-space:nowrap; }
  .rc-combobox-cat { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }
  .rc-combobox-empty { padding:10px 12px; color:var(--muted); font-size:12px; }
  /* ---- tables ---- */
  .rc-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rc-table th { text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .rc-table td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; overflow-wrap:anywhere; }
  .rc-table tr:last-child td { border-bottom:none; }
  .rc-table tr:hover td { background:rgba(255,255,255,.02); }
  .rc-empty { color:var(--muted); text-align:center; padding:14px !important; }
  .rc-mono { font-family:var(--mono); font-size:12px; }
  /* ---- badges / chips ---- */
  .rc-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .rc-badge.ok { background:rgba(98,180,125,.16); color:var(--accent); }
  .rc-badge.warn { background:rgba(212,173,95,.16); color:var(--accent2); }
  .rc-badge.err { background:rgba(223,116,116,.16); color:var(--red); }
  .rc-badge.muted { background:var(--surface2); color:var(--muted); }
  .rc-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  /* ---- profile ---- */
  .rc-profile { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .rc-profile-id .rc-title { font-size:20px; }
  /* ---- traffic ---- */
  .rc-view-fill { display:flex; flex-direction:column; gap:10px; height:100%; min-height:0; }
  .rc-view-fill .rc-title { margin-bottom:0; }
  .rc-view-fill .rc-sub { margin-bottom:0; }
  .rc-view-fill .rc-toolbar { margin:0; }
  .rc-request-list { flex:1 1 auto; min-height:0; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .rc-traffic-foot { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-top:2px; }
  .rc-request { background:var(--surface2); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none; }
  .rc-request-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 14px; cursor:pointer; }
  .rc-request-head:hover { background:var(--surface2); }
  .rc-method { font:700 12px var(--mono); padding:3px 10px; border-radius:6px; letter-spacing:.3px; }
  .rc-method.ok { background:rgba(98,180,125,.15); color:var(--accent); }
  .rc-method.warn { background:rgba(212,173,95,.15); color:var(--accent2); }
  .rc-method.err { background:rgba(223,116,116,.15); color:var(--red); }
  .rc-method.rpc { background:rgba(106,169,216,.15); color:var(--blue); }
  .rc-status { font:700 12px var(--mono); color:var(--muted); }
  .rc-user { font-size:11px; font-weight:700; color:var(--blue); background:rgba(106,169,216,.14); padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .rc-summary { flex:1 1 0; min-width:260px; font:12.5px var(--mono); line-height:1.45; word-break:break-all; }
  .rc-time { color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .rc-size { color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .rc-request-detail { border-top:1px dashed var(--line); padding:10px 14px; background:rgba(255,255,255,.02); }
  .rc-request-detail pre { margin:0; white-space:pre-wrap; word-break:break-all; font:13px/1.55 var(--mono); color:var(--text); max-height:60vh; overflow:auto; }
  /* ---- images ---- */
  .rc-thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .rc-thumbs figure { margin:0; }
  .rc-thumbs img { width:100%; height:110px; object-fit:contain; background:#0a0b0c; border:1px solid var(--line); border-radius:8px; }
  .rc-thumbs figcaption { font-size:11px; color:var(--muted); margin-top:4px; }
  /* ---- JSON ---- */
  .rc-json { margin-top:8px; }
  .rc-json summary { cursor:pointer; color:var(--muted); font-weight:600; }
  .rc-json pre { max-height:220px; overflow:auto; font:11.5px var(--mono); color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  /* ---- modal ---- */
  .rc-modal-overlay {
    position:fixed; inset:0; background:rgba(6,7,8,.66); backdrop-filter:blur(2px);
    display:grid; place-items:center; z-index:50; padding:20px;
  }
  .rc-modal { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; max-width:560px; width:100%; max-height:86vh; overflow:auto; }
  .rc-modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .rc-modal h2 { margin:0; font-size:16px; }
  .rc-modal-msg { color:var(--muted); }
  .rc-modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
  /* ---- toast ---- */
  #rc-toast-root { position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .rc-toast { background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:in .18s ease-out; }
  .rc-toast.ok { border-color:var(--accent); }
  .rc-toast.err { border-color:var(--red); }
  .rc-toast.out { opacity:0; transition:opacity .4s; }
  @keyframes in { from { transform:translateY(8px); opacity:0; } }
  .rc-danger { border-color:var(--red); }
  .rc-warn-banner { border-color:var(--accent2); }
  .rc-warn-banner p { margin:6px 0 0; color:var(--muted); font-size:12.5px; }
  .rc-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  @media (max-width:720px) { body { grid-template-columns:1fr; } #rc-side { position:static; height:auto; } #rc-view { height:auto; } }
</style>
</head>
<body>
<aside id="rc-side"></aside>
<main id="rc-view"></main>
<script type="module" src="/admin/main.js"></script>
</body>
</html>
