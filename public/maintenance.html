<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#35c0e9">
<title>Restaurant City Reborn — Temporarily Closed</title>
<style>
  :root { color-scheme:light; --sky:#35c0e9; --sky-dark:#1d86bd; --ink:#2c435a; --paper:#fffaf0; --line:#a9cfdd; --green:#6fbf3b; --green-dark:#4e971f; }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); font:16px/1.55 "Trebuchet MS","Segoe UI",sans-serif; background:radial-gradient(150px 65px at 14% 20%,rgba(255,255,255,.85),transparent 72%),radial-gradient(220px 80px at 82% 14%,rgba(255,255,255,.7),transparent 72%),linear-gradient(180deg,var(--sky),#9de2f5); }
  main { width:min(620px,100%); text-align:center; background:var(--paper); border:4px solid rgba(48,85,133,.45); border-radius:24px; padding:clamp(28px,7vw,56px); box-shadow:0 20px 50px rgba(29,84,120,.3); }
  .sign { display:inline-flex; align-items:center; gap:9px; margin-bottom:20px; padding:8px 15px; color:#fff; font-size:13px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; background:var(--sky-dark); border-radius:999px; }
  .dot { width:9px; height:9px; background:#ffd21f; border-radius:50%; box-shadow:0 0 0 4px rgba(255,210,31,.22); }
  .plate { width:92px; height:92px; margin:0 auto 20px; display:grid; place-items:center; border-radius:50%; background:#fff; border:8px solid #d8edf4; box-shadow:0 7px 0 var(--line),0 12px 20px rgba(29,84,120,.18); font-size:44px; }
  h1 { margin:0 0 14px; color:#305585; font-size:clamp(30px,7vw,47px); line-height:1.05; }
  p { max-width:44ch; margin:0 auto; color:#5c748a; font-size:clamp(16px,3vw,19px); }
  .small { margin-top:22px; color:#7b91a2; font-size:13px; }
  button { margin-top:28px; padding:12px 22px; color:#fff; font:800 15px inherit; cursor:pointer; background:linear-gradient(var(--green),var(--green-dark)); border:2px solid #3e7d19; border-radius:12px; box-shadow:0 4px 0 #376c17; }
  button:hover { filter:brightness(1.06); }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #376c17; }
</style>
</head>
<body>
<main>
  <div class="sign"><span class="dot"></span> Scheduled maintenance</div>
  <div class="plate" aria-hidden="true">🍽️</div>
  <h1>We’ll be right back!</h1>
  <p>{{MAINTENANCE_MESSAGE}}</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <div class="small">Restaurant City Reborn · Please retry in about {{RETRY_SECONDS}} seconds</div>
</main>
</body>
</html>
