<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account - Restaurant City</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .rc-btn.block { width: 100%; margin-top: 4px; }
  .id-line { font-weight: 700; color: var(--ink-soft); margin: 0 0 18px; }
  .id-line strong { color: var(--tomato-dk); }
</style>
</head>
<body>
<header class="rc-topbar">
  <a class="rc-brand" href="/"><span class="rc-plate"></span><span class="rc-wordmark">Restaurant City</span></a>
  <div style="flex:1"></div>
  <nav style="display:flex;gap:10px">
    <a class="rc-btn ghost small" href="/">Home</a>
    <a class="rc-btn green small" href="/game">Play</a>
  </nav>
</header>

<main class="rc-wrap rc-wrap-narrow">
  <span class="rc-eyebrow">Chef profile</span>
  <h1 class="rc-title">Your account</h1>
  <div class="rc-panel">
    <p class="id-line">Username: <strong id="username"></strong></p>
    <form id="form" class="rc-form">
      <label>First name<input class="rc-input" name="firstName" maxlength="50" required></label>
      <label>Last name<input class="rc-input" name="lastName" maxlength="50" required></label>
      <label>Current PIN<input class="rc-input" name="currentPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="current-password" required></label>
      <label>New PIN (optional)<input class="rc-input" name="newPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="new-password"></label>
      <small class="rc-note">Changing your PIN signs out your other sessions.</small>
      <button class="rc-btn green block">Save changes</button>
      <div id="msg" class="rc-msg" aria-live="polite"></div>
    </form>
  </div>
</main>
<script>
let csrf='';fetch('/__api/session').then(r=>r.json()).then(s=>{if(!s.loggedIn)return location.replace('/login?next=/account');csrf=s.csrfToken;username.textContent=s.account.username;form.firstName.value=s.account.firstName||'';form.lastName.value=s.account.lastName||''});form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='rc-msg';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/__api/account',{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Request failed');msg.textContent='Account updated.';msg.className='rc-msg ok';form.currentPin.value='';form.newPin.value=''}catch(err){msg.textContent=err.message||String(err);msg.className='rc-msg error'}});
</script>
</body>
</html>
