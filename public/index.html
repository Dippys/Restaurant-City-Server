<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant City · Local Server Dashboard</title>
<style>
  :root {
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323d;
    --txt:#d7dee7; --muted:#8b98a8; --accent:#57b6ff; --green:#4ec98b;
    --amber:#e6b555; --red:#e06c6c; --purple:#b48ce6;
    --mono:'Cascadia Code','Consolas','SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:5; }
  header h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.3px; }
  header h1 span { color:var(--accent); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--red);
         box-shadow:0 0 8px currentColor; }
  .dot.on { background:var(--green); }
  .spacer { flex:1; }
  .stat { color:var(--muted); font-size:12px; }
  .stat b { color:var(--txt); }
  input#filter { background:var(--panel2); border:1px solid var(--line); color:var(--txt);
                 border-radius:6px; padding:6px 10px; width:220px; font-size:12px; }
  button { background:var(--panel2); border:1px solid var(--line); color:var(--txt);
           border-radius:6px; padding:6px 11px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); color:#fff; }
  #list { padding:8px 12px 40px; }
  .row { background:var(--panel); border:1px solid var(--line); border-radius:8px;
         margin:6px 0; overflow:hidden; }
  .row.new { animation:flash .8s ease-out; }
  @keyframes flash { from { border-color:var(--accent); } to { border-color:var(--line); } }
  .head { display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; }
  .head:hover { background:var(--panel2); }
  .method { font:600 11px var(--mono); padding:2px 7px; border-radius:4px;
            min-width:46px; text-align:center; }
  .m-GET { background:#22303c; color:var(--accent); }
  .m-POST { background:#243726; color:var(--green); }
  .m-OPTIONS,.m-HEAD { background:#2f2a3a; color:var(--purple); }
  .path { font:12px var(--mono); flex:1; overflow:hidden; text-overflow:ellipsis;
          white-space:nowrap; }
  .badge { font:11px var(--mono); color:var(--muted); }
  .st { font:600 11px var(--mono); padding:1px 6px; border-radius:4px; }
  .st.ok { color:var(--green); } .st.miss { color:var(--amber); } .st.err { color:var(--red); }
  .kind { font:10px var(--mono); text-transform:uppercase; letter-spacing:.5px;
          padding:1px 6px; border-radius:4px; background:#2a2030; color:var(--purple); }
  .kind.rpc { background:#38260f; color:var(--amber); }
  .rpcsum { font:11px var(--mono); margin-left:10px; opacity:.9; }
  .rpcsum .sok { color:var(--green); } .rpcsum .serr { color:var(--amber); }
  .rpcsum.sok { color:var(--green); } .rpcsum.serr { color:var(--amber); }
  .decode { background:#0f1a14; border:1px solid #244; border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .decode .dh { font:600 11px var(--mono); color:var(--green); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  dd.sok { color:var(--green); } dd.serr { color:var(--amber); }
  dd.resphex { color:var(--accent); word-break:break-all; }
  .copy { margin-left:auto; }
  .body { display:none; border-top:1px solid var(--line); padding:10px 12px;
          background:#12161b; }
  .row.open .body { display:block; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:2px 12px; margin-bottom:10px; }
  .kv dt { color:var(--muted); font:11px var(--mono); }
  .kv dd { margin:0; font:11px var(--mono); word-break:break-all; }
  .tabs { display:flex; gap:6px; margin:6px 0; }
  .tabs button { padding:3px 10px; font-size:11px; }
  .tabs button.active { border-color:var(--accent); color:#fff; }
  pre { background:#0b0e12; border:1px solid var(--line); border-radius:6px;
        padding:10px; margin:0; overflow:auto; max-height:340px;
        font:11px/1.5 var(--mono); color:#c8d3df; white-space:pre-wrap; word-break:break-all; }
  .empty { color:var(--muted); text-align:center; padding:60px 0; }
  .hint { color:var(--muted); font-size:11px; }
  .hint code { color:var(--accent); background:var(--panel2); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Restaurant City <span>· local server</span></h1>
  <span class="stat"><b id="count">0</b> requests</span>
  <span class="stat">rpc: <b id="rpccount">0</b></span>
  <span class="stat">missing: <b id="misscount">0</b></span>
  <div class="spacer"></div>
  <input id="filter" placeholder="filter path / method…" />
  <label class="stat"><input type="checkbox" id="autoscroll" checked /> follow</label>
  <button id="copyall">Copy all</button>
  <button id="clear">Clear</button>
</header>

<div id="list">
  <div class="empty" id="empty">
    Waiting for requests…<br><br>
    <span class="hint">Start the client so it loads from here:<br>
    <code>flashplayer_32_sa_debug.exe http://localhost:8090/game.swf</code></span>
  </div>
</div>

<script>
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const dot = document.getElementById('dot');
const countEl = document.getElementById('count');
const rpcEl = document.getElementById('rpccount');
const missEl = document.getElementById('misscount');
const filterEl = document.getElementById('filter');
const autoscrollEl = document.getElementById('autoscroll');
const seen = new Map();
let total = 0, rpc = 0, miss = 0;

function fmtHex(hex) {
  if (!hex) return '(empty)';
  const bytes = hex.match(/.{1,2}/g) || [];
  let out = '';
  for (let i = 0; i < bytes.length; i += 16) {
    const slice = bytes.slice(i, i + 16);
    const off = i.toString(16).padStart(6, '0');
    const hexPart = slice.join(' ').padEnd(16 * 3 - 1, ' ');
    const ascii = slice.map(b => { const n = parseInt(b, 16); return n >= 32 && n < 127 ? String.fromCharCode(n) : '.'; }).join('');
    out += `${off}  ${hexPart}  ${ascii}\n`;
  }
  return out;
}

function copyText(entry) {
  const h = Object.entries(entry.headers).map(([k, v]) => `  ${k}: ${v}`).join('\n');
  return [
    `${entry.method} ${entry.path}  ->  HTTP ${entry.status}${entry.kind === 'rpc' ? '  [RPC]' : ''}`,
    `time: ${entry.time}`,
    Object.keys(entry.query).length ? `query: ${JSON.stringify(entry.query)}` : null,
    `headers:\n${h}`,
    `body: ${entry.bodyLen} bytes`,
    entry.bodyLen ? `body.hex:\n${entry.bodyHex}` : null,
    entry.bodyLen ? `body.base64:\n${entry.bodyBase64}` : null,
    entry.bodyLen ? `body.ascii:\n${entry.bodyText}` : null,
  ].filter(Boolean).join('\n');
}

async function toClipboard(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = o, 1000); }
}

function statusClass(s) { return s === 200 ? 'ok' : (s === 404 ? 'miss' : 'err'); }

function makeRow(entry) {
  const row = document.createElement('div');
  row.className = 'row new';
  row.dataset.search = (entry.method + ' ' + entry.path).toLowerCase();

  const r = entry.rpc;
  let rpcChip = '', rpcSummary = '';
  if (r) {
    if (r.subs && r.subs.length) {
      rpcChip = `<span class="kind rpc">batch·${r.subs.length}</span>`;
      rpcSummary = `<span class="rpcsum">${r.subs.map(s => `<span class="${s.answered === 'ok' ? 'sok' : 'serr'}">${escapeHtml(s.name)}</span>`).join(' ')}</span>`;
    } else {
      rpcChip = `<span class="kind rpc">${escapeHtml(r.call || 'rpc')}</span>`;
      rpcSummary = `<span class="rpcsum ${r.answered === 'ok' ? 'sok' : 'serr'}">${escapeHtml(r.answered || '')}</span>`;
    }
  }

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = `
    <span class="method m-${entry.method}">${entry.method}</span>
    <span class="path">${entry.path}${rpcSummary}</span>
    ${rpcChip}
    ${entry.bodyLen ? `<span class="badge">${entry.bodyLen}B</span>` : ''}
    <span class="st ${statusClass(entry.status)}">${entry.status}</span>
  `;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy'; copyBtn.textContent = 'Copy';
  copyBtn.onclick = (e) => { e.stopPropagation(); toClipboard(copyText(entry), copyBtn); };
  head.appendChild(copyBtn);

  const body = document.createElement('div');
  body.className = 'body';
  const q = Object.keys(entry.query).length ? `<dt>query</dt><dd>${escapeHtml(JSON.stringify(entry.query))}</dd>` : '';
  const hdrs = Object.entries(entry.headers).map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v))}</dd>`).join('');
  let decode = '';
  if (r) {
    const subRows = (r.subs || []).map(s => `<dt>${escapeHtml(s.name)}</dt><dd class="${s.answered === 'ok' ? 'sok' : 'serr'}">${escapeHtml(s.answered)}</dd>`).join('');
    decode = `
      <div class="decode">
        <div class="dh">RPC decode</div>
        <dl class="kv">
          <dt>call</dt><dd>${escapeHtml(r.call || '')}</dd>
          ${r.session ? `<dt>session</dt><dd>${escapeHtml(r.session)}</dd>` : ''}
          ${r.answered ? `<dt>answered</dt><dd class="${r.answered === 'ok' ? 'sok' : 'serr'}">${escapeHtml(r.answered)}</dd>` : ''}
          ${subRows}
          ${entry.respHex ? `<dt>our response</dt><dd class="resphex">${escapeHtml(entry.respHex)}</dd>` : ''}
        </dl>
      </div>`;
  }
  body.innerHTML = `
    ${decode}
    <dl class="kv">
      <dt>time</dt><dd>${entry.time}</dd>
      <dt>full url</dt><dd>${escapeHtml(entry.rawUrl)}</dd>
      <dt>matched file</dt><dd>${entry.matched ? escapeHtml(entry.matched) : '<span style="color:var(--amber)">— none (404 / stub) —</span>'}</dd>
      ${q}${hdrs}
    </dl>`;
  if (entry.bodyLen) {
    const tabs = document.createElement('div'); tabs.className = 'tabs';
    const pre = document.createElement('pre');
    const views = {
      hex: () => fmtHex(entry.bodyHex),
      ascii: () => entry.bodyText,
      base64: () => entry.bodyBase64,
    };
    Object.keys(views).forEach((name, i) => {
      const b = document.createElement('button'); b.textContent = name;
      if (i === 0) b.classList.add('active');
      b.onclick = () => { tabs.querySelectorAll('button').forEach(x => x.classList.remove('active')); b.classList.add('active'); pre.textContent = views[name](); };
      tabs.appendChild(b);
    });
    pre.textContent = views.hex();
    body.appendChild(tabs); body.appendChild(pre);
  } else {
    const p = document.createElement('div'); p.className = 'hint'; p.textContent = 'no request body';
    body.appendChild(p);
  }

  head.onclick = () => row.classList.toggle('open');
  row.appendChild(head); row.appendChild(body);
  applyFilter(row);
  return row;
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function applyFilter(row) {
  const f = filterEl.value.trim().toLowerCase();
  row.style.display = (!f || row.dataset.search.includes(f)) ? '' : 'none';
}

function addEntry(entry) {
  if (seen.has(entry.id)) return;
  seen.set(entry.id, entry);
  emptyEl.style.display = 'none';
  total++; if (entry.kind === 'rpc') rpc++; if (entry.status === 404) miss++;
  countEl.textContent = total; rpcEl.textContent = rpc; missEl.textContent = miss;
  const row = makeRow(entry);
  listEl.appendChild(row);
  if (autoscrollEl.checked) row.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

let csrfToken = '';
fetch('/__api/session').then(r => r.json()).then(session => { csrfToken = session.csrfToken || ''; }).catch(() => {});
filterEl.oninput = () => listEl.querySelectorAll('.row').forEach(applyFilter);
document.getElementById('clear').onclick = async () => {
  await fetch('/__api/clear', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } }).catch(() => {});
  listEl.querySelectorAll('.row').forEach(r => r.remove());
  seen.clear(); total = rpc = miss = 0;
  countEl.textContent = rpcEl.textContent = missEl.textContent = 0;
  emptyEl.style.display = '';
};
document.getElementById('copyall').onclick = (e) => {
  const all = [...seen.values()].map(copyText).join('\n\n' + '='.repeat(60) + '\n\n');
  toClipboard(all, e.target);
};

function connect() {
  const es = new EventSource('/__events');
  es.onopen = () => dot.classList.add('on');
  es.onerror = () => dot.classList.remove('on');
  es.onmessage = (ev) => { try { addEntry(JSON.parse(ev.data)); } catch {} };
}
connect();
</script>
</body>
</html>
